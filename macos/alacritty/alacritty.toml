# Alacritty — macOS
# Linux (Omarchy) has its own copy: .config/alacritty/alacritty.toml
# (bin/link-dotfiles picks one per platform). When changing shared settings
# (fonts, window, keyboard, terminal), check whether the other file needs the
# same change.

[env]
TERM = "xterm-256color"

[font]
normal = { family = "FiraCode Nerd Font", style = "Regular" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 13

[window]
padding.x = 10
padding.y = 10
decorations = "Buttonless"
opacity = 0.90
blur = true
option_as_alt = "Both"

[mouse]
hide_when_typing = true

# tokyo-rba (Tokyo Night)
[colors.primary]
background = "#1a1b26"
foreground = "#a9b1d6"

[colors.cursor]
text = "#1a1b26"
cursor = "#acb0d0"

[colors.vi_mode_cursor]
text = "#1a1b26"
cursor = "#acb0d0"

[colors.selection]
text = "#1a1b26"
background = "#7aa2f7"

[colors.search.matches]
foreground = "#1a1b26"
background = "#e0af68"

[colors.search.focused_match]
foreground = "#1a1b26"
background = "#f7768e"

[colors.footer_bar]
foreground = "#1a1b26"
background = "#a9b1d6"

[colors.normal]
black = "#32344a"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#ad8ee6"
cyan = "#449dab"
white = "#787c99"

[colors.bright]
black = "#444b6a"
red = "#ff7a93"
green = "#b9f27c"
yellow = "#ff9e64"
blue = "#7da6ff"
magenta = "#bb9af7"
cyan = "#0db9d7"
white = "#acb0d0"

[keyboard]
bindings = [
  { key = "F11", action = "ToggleFullscreen" },
  # Send Shift+Return as CSI-u so TUIs can distinguish it from Return without treating it as Alt+Return.
  { key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
  # Legacy encoding sends Alt+Shift+Return the same as Alt+Return; send CSI-u so tmux can match M-S-Enter.
  { key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" }
]

[terminal]
osc52 = "CopyPaste"
